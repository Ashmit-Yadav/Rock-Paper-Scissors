<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topBar">
        <div id="heading">
<h2>Rock Paper Scissors</h2>
        </div>
    </div>

    <div id="imgCont">
  <div class="img" id="Rock"><img src="rock.png"></div>
  <div class="img" id="Paper"><img src="paper.png"></div>
  <div class="img" id="Scissors"><img src="scissors.png"></div>
    </div>

    <div class="score">
        <p id="user">0</p>
        <p id="comp">0</p>
    </div>
    <div class="name">
        <p>You</p>
        <p>Comp</p>
    </div>

    <div id="end">
        <div id="innerEnd"><p><b>Pick your move</b></p></div>
        
    </div>
    <div id="reset">
  <button id="reSet">Reset Game</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
